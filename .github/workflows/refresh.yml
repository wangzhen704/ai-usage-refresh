name: Subscription Usage Window Probe

on:
  schedule:
    # GitHub cron is UTC. Every 5 hours is not evenly divisible into 24 hours.
    # This schedule is an approximate, deliberately sparse probe.
    - cron: '17 0,5,10,15,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subscription-probe
  cancel-in-progress: false

jobs:
  claude:
    name: Claude Pro minimal request
    if: github.repository == 'wangzhen704/ai-usage-refresh' && github.ref == 'refs/heads/main' && vars.ENABLE_CLAUDE_PROBE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: claude-probe
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate pinned Claude CLI version
        env:
          CLAUDE_CLI_VERSION: ${{ vars.CLAUDE_CLI_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLAUDE_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Set CLAUDE_CLI_VERSION to an exact audited X.Y.Z version"; exit 1; }
      - name: Install selected Claude CLI release
        env:
          CLAUDE_CLI_VERSION: ${{ vars.CLAUDE_CLI_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"
          claude --version
      - name: Send bounded subscription probe
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ''
          ANTHROPIC_AUTH_TOKEN: ''
          DISABLE_TELEMETRY: '1'
          DISABLE_AUTOUPDATER: '1'
        shell: bash
        run: bash scripts/probe-claude.sh

  codex-wif-readiness:
    name: Codex WIF configuration readiness (no requests)
    if: github.repository == 'wangzhen704/ai-usage-refresh' && github.ref == 'refs/heads/main' && vars.ENABLE_CODEX_WIF_PREFLIGHT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Validate non-secret configuration only
        env:
          CODEX_WIF_AUDIENCE: ${{ vars.CODEX_WIF_AUDIENCE }}
          CODEX_WIF_RULE_ID: ${{ vars.CODEX_WIF_RULE_ID }}
          CODEX_WIF_PROVIDER_ID: ${{ vars.CODEX_WIF_PROVIDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CODEX_WIF_AUDIENCE" && -n "$CODEX_WIF_RULE_ID" && -n "$CODEX_WIF_PROVIDER_ID" ]] || {
            echo "::error::Codex WIF is not configured. Follow docs/CODEX-WIF.md."
            exit 1
          }
          echo "Codex WIF configuration variables exist. No OIDC token was requested; no Codex request was made."
