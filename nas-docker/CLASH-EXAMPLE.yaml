# Your existing Mihomo container can remain in host network mode.
# No shared Docker bridge network or port mapping is needed.
services:
  mihomo:
    # Keep your existing audited image, volumes and command.
    container_name: mihomo
    restart: unless-stopped
    network_mode: host

# Ensure Mihomo's HTTP/mixed proxy listener is available on the NAS loopback,
# for example 127.0.0.1:7890. The dashboard uses http://127.0.0.1:7890.
